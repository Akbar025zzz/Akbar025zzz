name: Update GitHub Metrics

on:
  schedule:
    - cron: "0 1 * * *" # Setiap hari pukul 08.00 WIB
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta

      - name: Generate language statistics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8

      - name: Generate contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.calendar.svg
          base: ""
          plugin_isocalendar: yes
          config_timezone: Asia/Jakarta

      - name: Generate WakaTime coding activity
        uses: lowlighter/metrics@v3.34
        with:
          token: NOT_NEEDED
          user: ${{ github.repository_owner }}
          filename: metrics.wakatime.svg
          base: ""
          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
          plugin_wakatime_days: 30
          plugin_wakatime_sections: time, languages-graphs
          plugin_wakatime_repositories_visibility: public
